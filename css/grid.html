<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid - Two D Layout</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 2fr 3fr 2fr;
            align-items: center;
            justify-items: center;
        }

        .child {
            font-size: 28px;
        }

        .ch-1 {
            background-color: red;
            align-self: end;
            justify-self: end;
        }

        .ch-2 {
            background-color: rebeccapurple;
            align-self: start;
            justify-self: start;
        }

        .ch-3 {
            background-color: aquamarine;
            height: 100px;
        }

        .ch-4 {
            background-color: blue;
        }
        
        .ch-5 {
            background-color: yellowgreen;
            /* height: 300px; */
        }

        .ch-6 {
            background-color: violet;
        }

        .ch-7 {
            background-color: steelblue;
        }

        .ch-8 {
            background-color: chocolate;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child ch-1">HTML</div>
        <div class="child ch-2">AND</div>
        <div class="child ch-3">CSS</div>
        <div class="child ch-4">ARE</div>
        <div class="child ch-5">AWESOME</div>
        <div class="child ch-6">LANGUAGES</div>
        <div class="child ch-7">TO</div>
        <div class="child ch-8">LEARN</div>
    </div>
</body>
</html>
